<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة مكتب التدريب - الخطوط الجوية الليبية</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0056b3;
            text-align: center;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 15px;
        }
        .info-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .info-box h3 {
            margin-top: 0;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>منظومة مكتب التدريب</h1>
    <h3 style="text-align: center; color: #555;">الخطوط الجوية الليبية (Libyan Airlines)</h3>
    
    <div class="info-box">
        <h3>بيانات المنظومة والتدريب:</h3>
        <p><strong>الإصدار:</strong> 2.0</p>
        <p><strong>حالة التشغيل:</strong> تعمل أونلاين بنجاح عبر GitHub Pages ✈️</p>
        <p><strong>الموظف المستهدف:</strong> عبد المطلب (F-101) - مشرف رحلات</p>
        <p><strong>الطرازات:</strong> A320 & A330</p>
    </div>
</div>

</body>
</html>
